name: macOS
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install SuiteSparse
        run: |
          brew install suite-sparse
      - name: Configure environment
        run: |
          echo TMPDIR=/tmp | tee -a $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix suite-sparse)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          env
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests (Native)
        run: cargo test
      - name: Run tests (UMFPACK)
        run: cargo test --features umfpack

  # MUMPS is built locally: Homebrew ships no sequential package for it. Homebrew's
  # gcc provides gfortran and Accelerate provides the BLAS/LAPACK.
  mumps:
    name: MUMPS (locally compiled)
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: brew install gcc
      - name: Compile and install MUMPS
        run: |
          prefix="$RUNNER_TEMP/mumps"
          bash zscripts/macos-compile-mumps.bash "$prefix"
          echo "RUSSELL_LOCAL_PREFIX=$prefix" >> "$GITHUB_ENV"
          ls "$prefix/lib/mumps"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: mumps
      - name: Run tests (MUMPS)
        run: |
          # The run path covers russell_sparse's own targets; the other crates'
          # test binaries need the directory on the loader path.
          export DYLD_LIBRARY_PATH="$RUSSELL_LOCAL_PREFIX/lib/mumps:${DYLD_LIBRARY_PATH:-}"
          cargo test --features mumps
