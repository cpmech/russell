name: macOS
on: [pull_request]
jobs:
  test:
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Check out algebra_linear (the kernels this workspace depends on)
        uses: actions/checkout@v4
        with:
          repository: cpmech/algebra_linear
          path: algebra_linear
      - name: Configure environment
        run: |
          echo TMPDIR=/tmp | tee -a $GITHUB_ENV
          env
      - name: Install Libraries
        run: |
          brew install lapack openblas suite-sparse
      - name: Run tests
        run: |
          cargo test
