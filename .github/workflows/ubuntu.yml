name: Ubuntu
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      # Where the locally compiled SuiteSparse and MUMPS are installed by the
      # scripts below; the `local_umfpack` and `mumps` features read it.
      RUSSELL_LOCAL_PREFIX: /usr/local
    strategy:
      matrix:
        rust: [stable, nightly-2026-07-01]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: llvm-tools-preview
      # The kernels come from crates.io, so there is no sibling checkout: the
      # standalone check below downloads the published crate instead. It runs after
      # the toolchain is installed because it asks cargo which version it resolved
      # (this workspace commits no `Cargo.lock`).
      - name: algebra_linear must stay standalone
        run: |
          # The kernels' repository may not know about this one. The rule lives here
          # because this is the side where the name may legitimately appear.
          #
          # The check runs on the *published crate* -- the version cargo resolves and
          # links -- rather than on a sibling checkout of the other repository. That is
          # the artifact a user receives, it cannot drift under an unrelated commit
          # there, and it needs no tag or branch to exist. Its absence from the package
          # is also why a process file naming this repository is not a failure here: it
          # never reaches a build.
          version=$(cargo metadata --format-version 1 2>/dev/null \
            | jq -r '.packages[] | select(.name == "algebra_linear") | .version')
          test -n "$version" || { echo "::error::algebra_linear is not a dependency any more"; exit 1; }
          echo "checking algebra_linear ${version}, the version cargo resolves"
          # Extracted outside the checkout: a directory in the workspace would show
          # up as untracked in anyone's `git status` who runs this step locally.
          crate=$(mktemp -d)
          curl -sSfL "https://crates.io/api/v1/crates/algebra_linear/${version}/download" \
            | tar xz -C "$crate" --strip-components=1
          if grep -rni 'russell' "$crate"; then
            echo "::error::algebra_linear now references this repository; it must stay standalone"
            exit 1
          fi
      - name: Information
        run: |
          lsb_release -d
          rustup --version
      - name: Compile MUMPS
        run: |
          bash zscripts/debian-compile-mumps.bash
      - name: Compile SuiteSparse
        run: |
          bash zscripts/debian-compile-suitesparse.bash
      - name: Run tests
        run: |
          cargo test --features local_umfpack,mumps
      - name: Install cargo-llvm-cov
        if: startsWith(matrix.rust, 'nightly')
        run: |
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C ~/.cargo/bin
      - name: Generate code coverage
        if: startsWith(matrix.rust, 'nightly')
        run: |
          cargo llvm-cov --workspace --features local_umfpack,mumps \
            --ignore-filename-regex 'build.rs|mem_check.rs|mem_check_lab.rs|solve_matrix_market.rs|amplifier1t.rs|brusselator_pde.rs' \
            --lcov --output-path lcov.info
      # The 95% threshold is applied to the DA records of the lcov file, not with
      # `--fail-under-lines`: llvm-cov's own summary counts a line once per
      # monomorphization, which reports const-generic dimension dispatch as two
      # thirds uncovered. See zscripts/check-coverage.bash.
      - name: Check line coverage
        if: startsWith(matrix.rust, 'nightly')
        run: |
          bash zscripts/check-coverage.bash lcov.info 95
