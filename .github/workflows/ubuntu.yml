name: Ubuntu
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      # Where the locally compiled SuiteSparse and MUMPS are installed by the
      # scripts below; `mumps` requires it and `umfpack` prefers it.
      RUSSELL_LOCAL_PREFIX: /usr/local
    strategy:
      matrix:
        rust: [stable, nightly-2026-07-01]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: llvm-tools-preview
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Information
        run: |
          lsb_release -d
          rustup --version
      - name: Compile MUMPS
        run: |
          bash zscripts/debian-compile-mumps.bash
      - name: Compile SuiteSparse
        run: |
          bash zscripts/debian-compile-suitesparse.bash
      - name: Run tests (Direct, default features)
        run: cargo test
      - name: Run tests (UMFPACK)
        run: cargo test --features umfpack
      - name: Run tests (MUMPS)
        run: cargo test --features mumps
      - name: Run tests (UMFPACK + MUMPS)
        run: cargo test --features umfpack,mumps
      # `cpmech/rust-cov` installs cargo-llvm-cov, runs the workspace under
      # instrumentation and applies the 95% threshold to the DA records of the lcov
      # file, not with `--fail-under-lines`: llvm-cov's own summary counts a line
      # once per monomorphization, which reports const-generic dimension dispatch as
      # mostly uncovered -- russell_tensor reads 98.66% on the DA records and 87.32%
      # on the summary.
      - name: Coverage
        if: startsWith(matrix.rust, 'nightly')
        uses: cpmech/rust-cov@v1
        with:
          args: --workspace --features umfpack,mumps
          ignore-filename-regex: 'build.rs|mem_check.rs|mem_check_lab.rs|solve_matrix_market.rs|amplifier1t.rs|brusselator_pde.rs'
          min-lines: 95

  system-umfpack:
    runs-on: ubuntu-latest
    env:
      RUSSELL_LOCAL_PREFIX: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: system-umfpack
      - name: Install the packaged SuiteSparse
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev
      - name: Test the system fallback
        run: cargo test -p russell_sparse --features umfpack --lib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check with the minimum supported Rust version
        run: cargo check --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the WebAssembly targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check the browser target
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Check the WASI target
        run: cargo check --workspace --target wasm32-wasip1
