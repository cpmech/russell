name: Wasm
# The browser target (`wasm32-unknown-unknown`) is compile-checked in the Ubuntu
# workflow; this job *runs* the library tests on `wasm32-wasip1`. Cargo cannot
# execute a wasm binary by itself, so the runner script shells out to wasmtime
# with the current directory preopened. That lets the file-based tests (Matrix
# Market, JSON statistics) run instead of being skipped: the point is to test
# the wasm build, not a path that only works because CI preopened something.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      CARGO_TARGET_WASM32_WASIP1_RUNNER: ${{ github.workspace }}/zscripts/wasmtime-runner.sh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          rustc --version
          wasmtime --version
      - name: Run the workspace tests on WASI
        run: |
          cargo test --workspace --target wasm32-wasip1
