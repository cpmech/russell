name: Windows
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 1. Setup MSYS2 with UCRT64 and required libraries
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-suitesparse

      # 2. Setup Rust with the matching GNU target
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2

      # 3. Run Tests
      - name: Run tests (Native)
        shell: msys2 {0}
        env:
          MSYS2_PREFIX: '/ucrt64'
          RUST_BACKTRACE: 1
        run: |
          cargo test
      - name: Run tests (UMFPACK)
        shell: msys2 {0}
        env:
          MSYS2_PREFIX: '/ucrt64'
          RUST_BACKTRACE: 1
        run: |
          cargo test --features umfpack
