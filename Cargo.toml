[workspace]

members = [
  "russell_lab",
  "russell_nonlin",
  "russell_ode",
  "russell_pde",
  "russell_sparse",
  "russell_stat",
  "russell_tensor",
]

resolver = "2"

[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"

[profile.release]
lto = true
codegen-units = 1
