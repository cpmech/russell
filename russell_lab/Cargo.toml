[package]
name = "russell_lab"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Scientific laboratory for linear algebra and numerical mathematics"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_lab"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "vector", "linspace"]

[features]
# Native Rust BLAS/LAPACK is the default, so this is deliberately empty. There is
# no external library to find, nothing to link, and the crate builds anywhere --
# including `wasm32-unknown-unknown`, which has no libc for the C shim and no BLAS
# to link against.
#
# The two accelerator features below are opt-in. Each links the C shim in
# `c_code/interface_blas.c` against a different external library:
#
# * `oblas` -- OpenBLAS (also the reference netlib BLAS/LAPACK)
# * `mkl`   -- Intel oneAPI MKL
#
# They are mutually exclusive. Enabling neither (the default) uses `src/native`,
# whose routines are plain Rust and are tested for numerical parity against the
# reference LAPACK.
default = []
# Link the C shim against OpenBLAS.
oblas = []
# Link the C shim against Intel oneAPI MKL.
mkl = []

[dependencies]
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
plotpy = "1.24"
serde_json = "1.0"
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[[bench]]
name = "algo_chebyshev"
harness = false
path = "benchmarks/algo_chebyshev.rs"

[[bench]]
name = "matvec_benchmark"
harness = false
path = "benchmarks/matvec_benchmark.rs"

[[bench]]
name = "small_mat_inv_benchmark"
harness = false
path = "benchmarks/small_mat_inv_benchmark.rs"

[[bench]]
name = "small_ops_benchmark"
harness = false
path = "benchmarks/small_ops_benchmark.rs"

[lints]
workspace = true
