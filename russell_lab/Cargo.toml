[package]
name = "russell_lab"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Scientific laboratory for linear algebra and numerical mathematics"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_lab"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "vector", "linspace"]

[features]
# Benchmark harness only. Optional so that `cargo test` on a wasm target does not
# build it: criterion pulls rayon, which cannot compile for wasi or wasm32.
# Benches therefore need `cargo bench --features bench`.
bench = ["dep:criterion"]

# Native Rust BLAS/LAPACK is the default, so no feature is enabled unless asked
# for. There is no external library to find, nothing to link, and the crate builds anywhere --
# including `wasm32-unknown-unknown`, which has no libc for the C shim and no BLAS
# to link against.
#
# The two accelerator features below are opt-in. Each links the C shim in
# `c_code/interface_blas.c` against a different external library:
#
# * `open_blas` -- OpenBLAS (also the reference netlib BLAS/LAPACK)
# * `intel_mkl`   -- Intel oneAPI MKL
#
# `intel_mkl` takes precedence: enabling both links MKL and not OpenBLAS.
# Enabling neither (the default) uses `src/native`,
# whose routines are plain Rust and are tested for numerical parity against the
# reference LAPACK.
# Link the C shim against OpenBLAS.
open_blas = []
# Link the C shim against Intel oneAPI MKL.
intel_mkl = []
# DEVELOPMENT ONLY -- a reference LAPACK for the native routines' parity tests.
#
# Compiles the same C shim against a locally built LAPACK 3.12.1 and links it, so
# the tests can assert that the native Rust routines agree with the reference
# implementation to a tight tolerance. That is the difference between "the answer
# looks plausible" and "the answer is right", and it is the only practicable way
# to check the eigenvalue and SVD routines.
#
# Not for release: it needs a LAPACK build on the machine. See `build.rs` for the
# location, which `RUSSELL_DEV_LAPACK_ROOT` overrides.
#
# `cargo test -p russell_lab --features dev_lapack`
dev_lapack = []

[dependencies]
# Optional, feature-gated: only the benches use it. It lives here rather than in
# [dev-dependencies] because cargo forbids optional dev-dependencies, and an
# unconditional dev-dependency drags rayon into every wasm test build.
criterion = { version = "0.8", optional = true }
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
plotpy = "1.24"
serde_json = "1.0"
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[[bench]]
name = "backends_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/backends_benchmark.rs"

[[bench]]
name = "algo_chebyshev"
harness = false
required-features = ["bench"]
path = "benchmarks/algo_chebyshev.rs"

[[bench]]
name = "decomp_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/decomp_benchmark.rs"

[[bench]]
name = "matmul_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/matmul_benchmark.rs"

[[bench]]
name = "matvec_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/matvec_benchmark.rs"

[[bench]]
name = "small_mat_inv_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/small_mat_inv_benchmark.rs"

[[bench]]
name = "small_ops_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/small_ops_benchmark.rs"

[lints]
workspace = true
