[package]
name = "russell_lab"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Scientific laboratory for linear algebra and numerical mathematics"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_lab"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "vector", "linspace"]

[features]
# Deliberately empty: the BLAS/LAPACK integration must be opted into.
#
# A default feature that cannot be built on some target is not really a default
# — Cargo cannot turn a dependency's default features *off* from the outside, so
# while `lapack` was on by default there was no way for a wasm build to avoid
# it, even with `russell_lab`'s own defaults disabled, because sibling crates
# such as `russell_tensor` pulled the defaults in transitively.
#
# Native users should ask for it explicitly:
#
# ```text
# russell_lab = { version = "3", features = ["lapack"] }
# ```
default = []
# Links the C shim in `c_code/interface_blas.c` against an external BLAS/LAPACK
# (OpenBLAS by default, Intel MKL with `intel_mkl`). This is what native builds
# want, and the other crates in this workspace enable it from their own defaults.
#
# Turning it off makes the crate build for targets where no BLAS exists (e.g.
# `wasm32-unknown-unknown`): the C shim is not compiled and not linked, and the
# functions that would call into it fall back to portable Rust implementations.
# See `src/portable.rs` for exactly which functions that covers, and which are
# unavailable without this feature.
lapack = []
# The MKL backend is one of the two ways of supplying the BLAS/LAPACK that
# `lapack` links against, so it implies `lapack`.
intel_mkl = ["lapack"]

[dependencies]
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.8"
plotpy = "1.24"
serde_json = "1.0"
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[[bench]]
name = "algo_chebyshev"
harness = false
path = "benchmarks/algo_chebyshev.rs"

[[bench]]
name = "matvec_benchmark"
harness = false
path = "benchmarks/matvec_benchmark.rs"

[[bench]]
name = "small_mat_inv_benchmark"
harness = false
path = "benchmarks/small_mat_inv_benchmark.rs"

[[bench]]
name = "small_ops_benchmark"
harness = false
path = "benchmarks/small_ops_benchmark.rs"

[lints]
workspace = true
