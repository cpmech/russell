[package]
name = "russell_lab"
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Scientific laboratory for linear algebra and numerical mathematics"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_lab"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "vector", "linspace"]
exclude = ["AGENTS.md", ".github/", ".gitignore", "rustfmt.toml"]

[features]
# Benchmark harness only. Optional so that `cargo test` on a wasm target does not
# build it: criterion pulls rayon, which cannot compile for wasi or wasm32.
# Benches therefore need `cargo bench --features bench`.
bench = ["dep:criterion"]
# Link the C shim against OpenBLAS.
open_blas = []
# Link the C shim against Intel oneAPI MKL.
intel_mkl = []

[dependencies]
# The BLAS/LAPACK kernels: pure Rust, no external library.
algebra_linear = "1.1"
# Optional, feature-gated: only the benches use it. It lives here rather than in
# [dev-dependencies] because cargo forbids optional dev-dependencies, and an
# unconditional dev-dependency drags rayon into every wasm test build.
criterion = { version = "0.8", optional = true }
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
plotpy = "1.24"
serde_json = "1.0"
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[[bench]]
name = "backends_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/backends_benchmark.rs"

[[bench]]
name = "algo_chebyshev"
harness = false
required-features = ["bench"]
path = "benchmarks/algo_chebyshev.rs"

[[bench]]
name = "decomp_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/decomp_benchmark.rs"

[[bench]]
name = "matmul_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/matmul_benchmark.rs"

[[bench]]
name = "matvec_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/matvec_benchmark.rs"

[[bench]]
name = "small_mat_inv_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/small_mat_inv_benchmark.rs"

[[bench]]
name = "small_ops_benchmark"
harness = false
required-features = ["bench"]
path = "benchmarks/small_ops_benchmark.rs"

[lints]
workspace = true

# Browser builds have no `std::time::Instant`; `web-time` maps it to
# `performance.now()`. WASI keeps the standard library version.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"
