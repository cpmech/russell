[package]
name = "russell_nonlin"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Numerical continuation methods to solve nonlinear systems of equations"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_nonlin"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["numerical", "solver", "continuation", "nonlinear"]

[features]
# Links an external BLAS/LAPACK through `russell_lab`; off for targets
# that have none, such as `wasm32-unknown-unknown`.
open_blas = ["russell_lab/open_blas"]
intel_mkl = [
  "russell_lab/intel_mkl",
  "russell_sparse/intel_mkl",
  "russell_ode/intel_mkl",
]
local_sparse = ["russell_sparse/local_sparse", "russell_ode/local_sparse"]

[dependencies]
russell_lab = { path = "../russell_lab", version = "3" }
russell_sparse = { path = "../russell_sparse", version = "3" }
russell_stat = { path = "../russell_stat", version = "3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3"

[dev-dependencies]
russell_pde = { path = "../russell_pde", version = "3" }
russell_ode = { path = "../russell_ode", version = "3" }
plotpy = "1.24"
rayon = "1.12"
serial_test = "4.0"

[lints]
workspace = true
