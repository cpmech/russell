[package]
name = "russell_nonlin"
version = "5.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Numerical continuation methods to solve nonlinear systems of equations"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_nonlin"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["numerical", "solver", "continuation", "nonlinear"]

[features]
# Links an external BLAS/LAPACK through `russell_lab`; off for targets
# that have none, such as `wasm32-unknown-unknown`.
open_blas = ["russell_lab/open_blas"]
intel_mkl = [
  "russell_lab/intel_mkl",
  "russell_sparse/intel_mkl",
  "russell_ode/intel_mkl",
]
umfpack = ["russell_sparse/umfpack", "russell_ode/umfpack"]
mumps = ["russell_sparse/mumps", "russell_ode/mumps"]

[dependencies]
russell_lab = { path = "../russell_lab", version = "5" }
russell_sparse = { path = "../russell_sparse", version = "5" }
russell_stat = { path = "../russell_stat", version = "5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3"

[dev-dependencies]
russell_pde = { path = "../russell_pde", version = "5" }
russell_ode = { path = "../russell_ode", version = "5" }
plotpy = "1.24"
rayon = "1.12"
serial_test = "4.0"

[lints]
workspace = true
