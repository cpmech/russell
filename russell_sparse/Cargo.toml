[package]
name = "russell_sparse"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Sparse matrix calculations and solvers for linear systems"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_sparse"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "sparse", "solver"]

[features]
default = []
# Links an external BLAS/LAPACK through `russell_lab`; off for targets
# that have none, such as `wasm32-unknown-unknown`.
oblas = ["russell_lab/oblas"]
cudss = []
mkl = ["russell_lab/mkl"]
local_sparse = []

[dependencies]
num-traits = "0.2"
russell_lab = { path = "../russell_lab", version = "3" }
structopt = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[lints]
workspace = true
