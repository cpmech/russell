[package]
name = "russell_sparse"
version = "4.0.0"
edition = "2024"
license = "MIT"
description = "Sparse matrix calculations and solvers for linear systems"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_sparse"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["matrix", "sparse", "solver"]

[features]
# Links an external BLAS/LAPACK through `russell_lab`; off for targets
# that have none, such as `wasm32-unknown-unknown`.
open_blas = ["russell_lab/open_blas"]
intel_mkl = ["russell_lab/intel_mkl"]
# UMFPACK from a local install under RUSSELL_LOCAL_PREFIX, instead of the
# package-manager one found with pkg-config.
local_umfpack = []
# MUMPS from a local install under RUSSELL_LOCAL_PREFIX, alongside UMFPACK.
mumps = []

[dependencies]
num-traits = "0.2"
russell_lab = { path = "../russell_lab", version = "4" }
structopt = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serial_test = "4.0"

[build-dependencies]
cc = "1.4"
pkg-config = "0.3"

[lints]
workspace = true
