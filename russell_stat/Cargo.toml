[package]
name = "russell_stat"
version = "4.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Statistics calculations and (engineering) probability distributions"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_stat"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["statistics", "probability", "random", "numerical"]

[features]
# Links an external BLAS/LAPACK through `russell_lab`; off for targets
# that have none, such as `wasm32-unknown-unknown`.
open_blas = ["russell_lab/open_blas"]
intel_mkl = ["russell_lab/intel_mkl"]

[dependencies]
russell_lab = { path = "../russell_lab", version = "4" }
num-traits = "0.2"
rand = "0.10"
rand_distr = "0.6"

[dev-dependencies]
plotpy = "1.24"

[lints]
workspace = true

# `rand` needs a browser entropy source on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
