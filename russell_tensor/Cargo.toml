[package]
name = "russell_tensor"
version = "3.3.1"
edition = "2024"
license = "MIT"
description = "Tensor analysis, calculus, and functions for continuum mechanics"
homepage = "https://github.com/cpmech/russell"
repository = "https://github.com/cpmech/russell"
documentation = "https://docs.rs/russell_tensor"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["tensor", "continuum", "mechanics"]

[features]
# `open_blas` links an external OpenBLAS. It is **not** on by default: the native
# Rust BLAS/LAPACK in `russell_lab` is the default and needs no external library,
# so the crate builds for any target, including `wasm32-unknown-unknown`.
#
# Enable `open_blas` (or `intel_mkl`) only to swap the native routines for a tuned library.
default = []
open_blas = ["russell_lab/open_blas"]
intel_mkl = ["russell_lab/intel_mkl"]

[dependencies]
# `default-features = false` is required, not merely tidy: `russell_lab`'s
# `default` is empty, but a consumer that disables this crate's defaults must not
# have `russell_lab`'s defaults re-enabled underneath it. Cargo offers no way to
# turn a dependency's default features off from the outside, so the declaration
# here is the only place it can be done. The `open_blas` feature below re-enables
# what this crate needs.
russell_lab = { path = "../russell_lab", version = "3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "polar_decomp_benchmark"
harness = false
path = "benchmarks/polar_decomp_benchmark.rs"

[[bench]]
name = "eigen_values_benchmark"
harness = false
path = "benchmarks/eigen_values_benchmark.rs"

[lints]
workspace = true
